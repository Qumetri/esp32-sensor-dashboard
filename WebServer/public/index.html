<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Room climate</title>

    <script>
        // Runs before the page paints, so a dark-theme visit never flashes light.
        (function () {
            var saved = null;
            try { saved = localStorage.getItem("theme"); } catch (e) { }
            var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme = dark ? "dark" : "light";
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap">

    <style>
        /*
         * Hygrothermograph: the analog instrument that records temperature and
         * humidity as two pen traces on gridded chart paper. Red pen, blue pen,
         * cool paper. Both ink pairs validated (lightness band, chroma, CVD,
         * contrast) against their own surface.
         */
        :root {
            color-scheme: light;
            --page: #e8eef1;
            --surface: #fbfcfc;
            --ink: #15232c;
            --ink-2: #4b5c68;
            --muted: #74838e;
            --grid: #dde5ea;
            --rule: #c2cdd4;
            --temp: #c8432f;
            --hum: #2b6cc4;
            --good: #0b8a0b;
            --warn: #b97d00;
            --bad: #c53434;
            --focus: #2b6cc4;
            --band-alpha: 0.16;
            --font: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        /* Dark is selected, not inverted: its own ink steps, validated against the
           dark surface. data-theme is set before first paint by the script in
           <head> (saved choice, else the OS setting). */
        :root[data-theme="dark"] {
            color-scheme: dark;
            --page: #0d1316;
            --surface: #161d21;
            --ink: #eef3f5;
            --ink-2: #b2bfc7;
            --muted: #85939d;
            --grid: #232d33;
            --rule: #36444d;
            --temp: #e05a45;
            --hum: #4a8ae0;
            --good: #2fbf4f;
            --warn: #f0b429;
            --bad: #ef6b6b;
            --focus: #6aa3ee;
            /* the same wash is near-invisible on a dark surface */
            --band-alpha: 0.32;
        }

        * {
            box-sizing: border-box;
        }

        /* Author display rules (.empty is flex) beat the UA's [hidden] rule, so
           without this, setting el.hidden = true silently does nothing. */
        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            padding: 28px 20px 40px;
            background: var(--page);
            color: var(--ink);
            font: 15px/1.5 var(--font);
        }

        main {
            max-width: 1040px;
            margin: 0 auto;
        }

        main.refreshing .chart-box,
        main.refreshing .readings {
            opacity: .5;
        }

        /* ---------- header ---------- */
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px 24px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .live {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            font-size: 14px;
            color: var(--ink-2);
        }

        .live .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--muted);
        }

        .live[data-state="good"] .dot {
            background: var(--good);
        }

        .live[data-state="warn"] .dot {
            background: var(--warn);
        }

        .live[data-state="bad"] .dot {
            background: var(--bad);
        }

        .live .state {
            color: var(--ink);
            font-weight: 600;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 10px 20px;
            flex-wrap: wrap;
        }

        .theme {
            appearance: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            padding: 5px 12px 5px 10px;
            border: 1px solid var(--rule);
            border-radius: 999px;
            background: var(--surface);
            color: var(--ink-2);
            font: 500 13px/1.4 var(--font);
            cursor: pointer;
        }

        .theme:hover {
            color: var(--ink);
        }

        /* a half-filled disc: the switch's state reads from its fill, not colour alone */
        .theme .disc {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1.5px solid currentColor;
            background: linear-gradient(90deg, currentColor 50%, transparent 50%);
        }

        .theme[aria-pressed="true"] .disc {
            background: currentColor;
        }

        /* ---------- range control: one row, scopes everything below ---------- */
        .range {
            display: inline-flex;
            gap: 2px;
            padding: 3px;
            border-radius: 999px;
            background: var(--surface);
            border: 1px solid var(--rule);
            margin-bottom: 26px;
        }

        .range button {
            appearance: none;
            border: 0;
            margin: 0;
            padding: 6px 16px;
            border-radius: 999px;
            background: transparent;
            color: var(--ink-2);
            font: 500 14px/1.4 var(--font);
            cursor: pointer;
        }

        .range button:hover {
            color: var(--ink);
        }

        .range button[aria-pressed="true"] {
            background: var(--ink);
            color: var(--surface);
        }

        :focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }

        /* ---------- current reading: the one loud element ---------- */
        .readings {
            display: flex;
            align-items: flex-end;
            gap: 8px 48px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .reading {
            margin: 0;
        }

        .reading .value {
            display: block;
            font-size: 64px;
            line-height: 1;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .reading .value small {
            font-size: 28px;
            font-weight: 500;
            letter-spacing: 0;
            margin-left: 4px;
            color: var(--ink-2);
        }

        .reading .label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 14px;
            color: var(--ink-2);
        }

        /* identity comes from a pen-stroke key beside the text, never from coloring the text */
        .pen {
            display: inline-block;
            width: 18px;
            height: 3px;
            border-radius: 2px;
            flex: none;
        }

        .pen.temp {
            background: var(--temp);
        }

        .pen.hum {
            background: var(--hum);
        }

        .summary {
            margin: 14px 0 30px;
            max-width: 68ch;
            color: var(--ink-2);
        }

        /* ---------- chart panels ---------- */
        .panel {
            background: var(--surface);
            border: 1px solid var(--rule);
            padding: 18px 20px 14px;
            margin-bottom: 18px;
        }

        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 6px 20px;
            flex-wrap: wrap;
        }

        h2 {
            margin: 0;
            font-size: 17px;
            font-weight: 600;
        }

        .key {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            margin: 0;
            font-size: 13px;
            color: var(--ink-2);
        }

        .key span {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .swatch-band {
            display: inline-block;
            width: 18px;
            height: 10px;
            border-radius: 2px;
            flex: none;
        }

        .stats {
            display: flex;
            gap: 6px 28px;
            flex-wrap: wrap;
            margin: 12px 0 10px;
            font-size: 14px;
        }

        .stats div {
            display: flex;
            gap: 6px;
            align-items: baseline;
        }

        .stats dt {
            color: var(--muted);
        }

        .stats dd {
            margin: 0;
            font-weight: 600;
        }

        .stats .when {
            font-weight: 400;
            color: var(--ink-2);
        }

        .chart-box {
            position: relative;
            height: 250px;
        }

        .empty {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0 24px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        /* ---------- tooltip: value leads, label follows ---------- */
        .tip {
            position: absolute;
            top: 6px;
            z-index: 2;
            min-width: 168px;
            padding: 10px 12px;
            background: var(--surface);
            border: 1px solid var(--rule);
            border-radius: 6px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
            pointer-events: none;
            font-size: 13px;
        }

        .tip .t {
            color: var(--ink-2);
            margin-bottom: 6px;
        }

        .tip .row {
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.7;
        }

        .tip .row strong {
            font-size: 14px;
            color: var(--ink);
        }

        .tip .row span:last-child {
            color: var(--ink-2);
        }

        .tip .n {
            margin-top: 4px;
            color: var(--muted);
        }

        /* ---------- table view: every chart has one ---------- */
        details {
            margin-top: 8px;
            font-size: 14px;
        }

        summary {
            cursor: pointer;
            color: var(--ink-2);
            padding: 4px 0;
            width: fit-content;
        }

        summary:hover {
            color: var(--ink);
        }

        .table-wrap {
            max-height: 300px;
            overflow: auto;
            margin-top: 8px;
            border-top: 1px solid var(--rule);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-variant-numeric: tabular-nums;
        }

        th,
        td {
            padding: 6px 10px;
            text-align: right;
            border-bottom: 1px solid var(--grid);
            white-space: nowrap;
        }

        th:first-child,
        td:first-child {
            text-align: left;
        }

        th {
            position: sticky;
            top: 0;
            background: var(--surface);
            color: var(--muted);
            font-weight: 500;
        }

        /* ---------- footer ---------- */
        .foot {
            margin: 6px 0 0;
            max-width: 72ch;
            font-size: 14px;
            color: var(--muted);
        }

        .foot.error {
            color: var(--bad);
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 16px 32px;
            }

            .reading .value {
                font-size: 48px;
            }

            .reading .value small {
                font-size: 22px;
            }

            .panel {
                padding: 14px 14px 10px;
            }

            .chart-box {
                height: 220px;
            }
        }
    </style>
</head>

<body>
    <main id="main">
        <div class="top">
            <h1>Room climate</h1>
            <div class="top-right">
                <p class="live" id="live" data-state="none">
                    <span class="dot" aria-hidden="true"></span>
                    <span class="state" id="live-state">Connecting</span>
                    <span id="live-age"></span>
                </p>
                <button type="button" class="theme" id="theme" aria-pressed="false">
                    <span class="disc" aria-hidden="true"></span>Dark theme
                </button>
            </div>
        </div>

        <div class="range" role="group" aria-label="Time range" id="range">
            <button type="button" data-range="15m" aria-pressed="false">15 min</button>
            <button type="button" data-range="1h" aria-pressed="true">1 hour</button>
            <button type="button" data-range="1d" aria-pressed="false">24 hours</button>
            <button type="button" data-range="1w" aria-pressed="false">7 days</button>
        </div>

        <div class="readings">
            <p class="reading">
                <span class="value"><span id="now-temp">&ndash;</span><small>°C</small></span>
                <span class="label"><span class="pen temp" aria-hidden="true"></span>Temperature now</span>
            </p>
            <p class="reading">
                <span class="value"><span id="now-hum">&ndash;</span><small>%</small></span>
                <span class="label"><span class="pen hum" aria-hidden="true"></span>Humidity now</span>
            </p>
        </div>
        <p class="summary" id="summary">&nbsp;</p>

        <section class="panel" id="panel-temp" aria-labelledby="h-temp">
            <div class="panel-head">
                <h2 id="h-temp">Temperature</h2>
                <p class="key">
                    <span><span class="pen temp" aria-hidden="true"></span>Average</span>
                    <span><span class="swatch-band" data-band="temp" aria-hidden="true"></span><span
                            class="band-text">Low to high within each minute</span></span>
                </p>
            </div>
            <dl class="stats">
                <div><dt>Low</dt><dd><span data-stat="low">&ndash;</span> <span class="when" data-stat="low-at"></span></dd></div>
                <div><dt>Average</dt><dd data-stat="avg">&ndash;</dd></div>
                <div><dt>High</dt><dd><span data-stat="high">&ndash;</span> <span class="when" data-stat="high-at"></span></dd></div>
                <div><dt>Variation</dt><dd data-stat="sd">&ndash;</dd></div>
            </dl>
            <div class="chart-box">
                <canvas id="chart-temp" role="img" aria-label="Temperature chart"></canvas>
                <div class="tip" hidden></div>
                <p class="empty" hidden></p>
            </div>
            <details>
                <summary>Show the numbers</summary>
                <div class="table-wrap"></div>
            </details>
        </section>

        <section class="panel" id="panel-hum" aria-labelledby="h-hum">
            <div class="panel-head">
                <h2 id="h-hum">Humidity</h2>
                <p class="key">
                    <span><span class="pen hum" aria-hidden="true"></span>Average</span>
                    <span><span class="swatch-band" data-band="hum" aria-hidden="true"></span><span
                            class="band-text">Low to high within each minute</span></span>
                </p>
            </div>
            <dl class="stats">
                <div><dt>Low</dt><dd><span data-stat="low">&ndash;</span> <span class="when" data-stat="low-at"></span></dd></div>
                <div><dt>Average</dt><dd data-stat="avg">&ndash;</dd></div>
                <div><dt>High</dt><dd><span data-stat="high">&ndash;</span> <span class="when" data-stat="high-at"></span></dd></div>
                <div><dt>Variation</dt><dd data-stat="sd">&ndash;</dd></div>
            </dl>
            <div class="chart-box">
                <canvas id="chart-hum" role="img" aria-label="Humidity chart"></canvas>
                <div class="tip" hidden></div>
                <p class="empty" hidden></p>
            </div>
            <details>
                <summary>Show the numbers</summary>
                <div class="table-wrap"></div>
            </details>
        </section>

        <p class="foot" id="foot">Loading readings&hellip;</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script>
        const POLL_MS = 5000;

        const RANGE_TEXT = {
            "15m": "the last 15 minutes",
            "1h": "the last hour",
            "1d": "the last 24 hours",
            "1w": "the last 7 days",
        };

        // Per-metric settings. minSpan stops the y-axis from zooming in on sensor
        // noise: the DHT-22 reads in 0.1 steps, and a 0.1 °C wobble stretched to
        // fill the chart reads as a dramatic swing.
        const METRICS = {
            temp: {
                name: "temperature", unit: "°C", tick: "°", colorVar: "--temp",
                minSpan: 2, floor: -40, ceil: 80, steady: 0.1,
                avg: p => p.tAvg, lo: p => p.tMin, hi: p => p.tMax,
                stats: s => s.temperature,
            },
            hum: {
                name: "humidity", unit: "%", tick: "%", colorVar: "--hum",
                minSpan: 6, floor: 0, ceil: 100, steady: 0.5,
                avg: p => p.hAvg, lo: p => p.hMin, hi: p => p.hMax,
                stats: s => s.humidity,
            },
        };

        let range = "1h";
        let last = null;      // last successful payload
        let grid = [];        // full bucket grid for the current payload
        const charts = {};

        const $ = id => document.getElementById(id);
        const tok = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

        function rgba(hex, a) {
            const n = parseInt(hex.slice(1), 16);
            return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
        }

        const one = v => (v === null || v === undefined || Number.isNaN(v)) ? "–" : v.toFixed(1);

        // ---------- time formatting ----------
        const hm = d => d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        const hms = d => d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
        const day = d => d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" });
        const wd = d => d.toLocaleDateString([], { weekday: "short" });

        function bucketWords(ms) {
            if (ms === 15_000) return "each 15 seconds";
            if (ms === 60_000) return "each minute";
            if (ms === 15 * 60_000) return "each 15 minutes";
            if (ms === 60 * 60_000) return "each hour";
            return "each bucket";
        }

        // What one point on the chart covers, e.g. "Tue 14:15–14:30".
        function spanText(t, bucketMs, r) {
            const a = new Date(t), b = new Date(t + bucketMs);
            if (r === "15m") return `${hms(a)}–${hms(b)}`;
            if (r === "1h") return `${hm(a)}–${hm(b)}`;
            if (r === "1d") return `${wd(a)} ${hm(a)}–${hm(b)}`;
            return `${day(a)}, ${hm(a)}–${hm(b)}`;
        }

        // When an extreme happened, at the precision the range can support.
        function whenText(t, r) {
            const d = new Date(t);
            if (r === "15m") return "at " + hms(d);
            if (r === "1h") return "at " + hm(d);
            return "on " + wd(d) + " at " + hm(d);
        }

        // Clean, regularly spaced x labels instead of whatever autoSkip lands on.
        // On narrow charts the step doubles so labels never run into each other.
        function tickLabel(i, narrow) {
            const p = grid[i], prev = grid[i - 1];
            if (!p) return null;
            const d = new Date(p.t);
            const hour = d.toLocaleTimeString([], { hour: "numeric" });
            switch (range) {
                case "15m": return d.getSeconds() < 15 && d.getMinutes() % (narrow ? 5 : 3) === 0 ? hm(d) : null;
                case "1h": return d.getMinutes() % (narrow ? 20 : 10) === 0 ? hm(d) : null;
                case "1d":
                    if (d.getMinutes() >= 15 || d.getHours() % (narrow ? 6 : 3) !== 0) return null;
                    return d.getHours() === 0 ? wd(d) : hour;
                case "1w":
                    if (!prev || new Date(prev.t).getDate() === d.getDate()) return null;
                    return narrow ? wd(d) : d.toLocaleDateString([], { weekday: "short", day: "numeric" });
            }
            return null;
        }

        function ago(ms) {
            const s = Math.max(0, Math.round(ms / 1000));
            if (s < 60) return `${s} s ago`;
            const m = Math.round(s / 60);
            if (m < 60) return `${m} min ago`;
            const h = Math.round(m / 60);
            if (h < 48) return `${h} h ago`;
            return `${Math.round(h / 24)} days ago`;
        }

        // ---------- chart plugins ----------
        // Vertical hairline at the hovered time, drawn under the data.
        const crosshair = {
            id: "crosshair",
            beforeDatasetsDraw(chart) {
                const active = chart.tooltip?.getActiveElements?.() ?? [];
                if (!active.length) return;
                const x = Math.round(active[0].element.x) + 0.5;
                const { top, bottom } = chart.chartArea;
                const c = chart.ctx;
                c.save();
                c.strokeStyle = tok("--rule");
                c.lineWidth = 1;
                c.beginPath();
                c.moveTo(x, top);
                c.lineTo(x, bottom);
                c.stroke();
                c.restore();
            },
        };

        function ringDot(c, x, y, r, fill) {
            c.beginPath();
            c.arc(x, y, r + 2, 0, Math.PI * 2);
            c.fillStyle = tok("--surface");
            c.fill();
            c.beginPath();
            c.arc(x, y, r, 0, Math.PI * 2);
            c.fillStyle = fill;
            c.fill();
        }

        // Selective direct labels: the latest value at the line's end, plus the
        // high and the low. Never a number on every point.
        const annotate = {
            id: "annotate",
            afterDatasetsDraw(chart) {
                const m = METRICS[chart.$key];
                const [dsHi, dsLo, dsAvg] = chart.data.datasets;
                const avg = dsAvg.data, hi = dsHi.data, lo = dsLo.data;

                let end = -1;
                for (let i = avg.length - 1; i >= 0; i--) if (avg[i] !== null) { end = i; break; }
                if (end < 0) return;

                const c = chart.ctx;
                const area = chart.chartArea;
                const color = tok(m.colorVar);
                c.save();
                c.textBaseline = "middle";

                let iHi = -1, iLo = -1;
                for (let i = 0; i < hi.length; i++) {
                    if (hi[i] !== null && (iHi < 0 || hi[i] > hi[iHi])) iHi = i;
                    if (lo[i] !== null && (iLo < 0 || lo[i] < lo[iLo])) iLo = i;
                }

                // Only mark extremes when they differ meaningfully; on a flat
                // trace "High 22.4 / Low 22.4" is noise.
                if (iHi >= 0 && iLo >= 0 && hi[iHi] - lo[iLo] >= m.steady * 2) {
                    c.font = `500 12px ${tok("--font")}`;
                    c.fillStyle = tok("--ink-2");
                    for (const [i, meta, text, dir] of [
                        [iHi, chart.getDatasetMeta(0), `High ${one(hi[iHi])}${m.tick}`, -1],
                        [iLo, chart.getDatasetMeta(1), `Low ${one(lo[iLo])}${m.tick}`, 1],
                    ]) {
                        const p = meta.data[i];
                        // An extreme right next to the end point would double up with
                        // the end label; the stat row above the chart still reports it.
                        if (!p || i >= end - 2) continue;
                        ringDot(c, p.x, p.y, 3, color);
                        const w = c.measureText(text).width;
                        const x = Math.min(Math.max(p.x, area.left + w / 2 + 2), area.right - w / 2 - 2);
                        c.textAlign = "center";
                        c.fillStyle = tok("--ink-2");
                        c.fillText(text, x, p.y + dir * 12);
                    }
                }

                const p = chart.getDatasetMeta(2).data[end];
                ringDot(c, p.x, p.y, 4, color);
                c.font = `600 13px ${tok("--font")}`;
                c.fillStyle = tok("--ink");
                c.textAlign = "left";
                c.fillText(`${one(avg[end])}${m.tick}`, p.x + 10, p.y);
                c.restore();
            },
        };

        // ---------- tooltip ----------
        function externalTooltip(key) {
            return ({ chart, tooltip }) => {
                const box = chart.canvas.parentNode;
                const tip = box.querySelector(".tip");
                const m = METRICS[key];
                const i = tooltip.dataPoints?.[0]?.dataIndex;
                const p = i === undefined ? null : grid[i];

                if (tooltip.opacity === 0 || !p || p.empty) {
                    tip.hidden = true;
                    return;
                }

                tip.replaceChildren();
                const add = (cls, text) => {
                    const el = document.createElement("div");
                    el.className = cls;
                    el.textContent = text;
                    tip.append(el);
                    return el;
                };
                const row = (keyEl, value, label) => {
                    const el = document.createElement("div");
                    el.className = "row";
                    const strong = document.createElement("strong");
                    strong.textContent = value;
                    const span = document.createElement("span");
                    span.textContent = label;
                    el.append(keyEl, strong, span);
                    tip.append(el);
                };

                add("t", spanText(p.t, last.bucketMs, range));

                const pen = document.createElement("span");
                pen.className = "pen " + key;
                row(pen, `${one(m.avg(p))} ${m.unit}`, "average");

                const band = document.createElement("span");
                band.className = "swatch-band";
                band.style.background = rgba(tok(m.colorVar), 0.22);
                row(band, `${one(m.lo(p))}–${one(m.hi(p))} ${m.unit}`, "low to high");

                add("n", `${p.samples.toLocaleString()} ${p.samples === 1 ? "reading" : "readings"}`);

                tip.hidden = false;
                const x = tooltip.caretX;
                const w = tip.offsetWidth;
                const left = x + 16 + w > box.clientWidth ? x - 16 - w : x + 16;
                tip.style.left = Math.max(0, left) + "px";
            };
        }

        // ---------- charts ----------
        function makeChart(key) {
            const m = METRICS[key];
            const color = tok(m.colorVar);
            const band = rgba(color, Number(tok("--band-alpha")));
            const chart = new Chart($("chart-" + key), {
                type: "line",
                data: {
                    labels: [],
                    datasets: [
                        { data: [], borderWidth: 0, borderColor: "transparent", backgroundColor: band, pointRadius: 0, pointHoverRadius: 0, fill: false, cubicInterpolationMode: "monotone" },
                        { data: [], borderWidth: 0, borderColor: "transparent", backgroundColor: band, pointRadius: 0, pointHoverRadius: 0, fill: "-1", cubicInterpolationMode: "monotone" },
                        {
                            data: [], borderColor: color, backgroundColor: color, borderWidth: 2,
                            borderCapStyle: "round", borderJoinStyle: "round", fill: false,
                            cubicInterpolationMode: "monotone",
                            // A lone bucket between gaps has no neighbours to draw a
                            // line to, so give it a small dot instead of nothing.
                            pointRadius: ctx => {
                                const d = ctx.dataset.data, i = ctx.dataIndex;
                                return d[i] !== null && d[i - 1] == null && d[i + 1] == null ? 2.5 : 0;
                            },
                            pointHoverRadius: 4, pointHoverBorderWidth: 2,
                            pointHoverBorderColor: tok("--surface"), pointHoverBackgroundColor: color,
                        },
                    ],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    spanGaps: false,
                    layout: { padding: { top: 18, right: 58, bottom: 0, left: 0 } },
                    interaction: { mode: "index", intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false, external: externalTooltip(key) },
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            border: { color: tok("--rule") },
                            ticks: {
                                autoSkip: false, maxRotation: 0, color: tok("--muted"),
                                font: { size: 12 },
                                callback(_, i) { return tickLabel(i, this.chart.width < 620); },
                            },
                        },
                        y: {
                            grid: { color: tok("--grid") },
                            border: { display: false },
                            ticks: {
                                maxTicksLimit: 5, color: tok("--muted"), font: { size: 12 },
                                callback: v => `${Number(v.toFixed(1))}${m.tick}`,
                            },
                        },
                    },
                },
                plugins: [crosshair, annotate],
            });
            chart.$key = key;

            const panel = $("panel-" + key);
            panel.querySelector(`[data-band="${key}"]`).style.background = rgba(color, 0.22);
            return chart;
        }

        function buildCharts() {
            for (const k of Object.keys(charts)) charts[k].destroy();
            Chart.defaults.font.family = tok("--font");
            charts.temp = makeChart("temp");
            charts.hum = makeChart("hum");
        }

        // ---------- rendering ----------
        // The server only returns buckets that have readings. Laying them onto a
        // full grid that spans the whole range keeps time evenly spaced and turns
        // missing buckets into visible gaps instead of silently joining across them.
        function buildGrid(d) {
            const byT = new Map(d.points.map(p => [p.t, p]));
            const out = [];
            const start = Math.floor(d.since / d.bucketMs) * d.bucketMs;
            for (let t = start; t <= d.now; t += d.bucketMs) {
                out.push(byT.get(t) ?? { t, empty: true });
            }
            return out;
        }

        function renderChart(key, d) {
            const m = METRICS[key];
            const chart = charts[key];
            const panel = $("panel-" + key);
            const val = f => grid.map(p => p.empty ? null : f(p));

            chart.data.labels = grid.map(p => p.t);
            chart.data.datasets[0].data = val(m.hi);
            chart.data.datasets[1].data = val(m.lo);
            chart.data.datasets[2].data = val(m.avg);

            // Y range: at least minSpan wide, centred on the data, with headroom
            // for the high/low labels.
            const filled = grid.filter(p => !p.empty);
            const y = chart.options.scales.y;
            if (filled.length) {
                const lo = Math.min(...filled.map(m.lo));
                const hi = Math.max(...filled.map(m.hi));
                const span = Math.max(m.minSpan, (hi - lo) * 1.3);
                const mid = (lo + hi) / 2;
                y.suggestedMin = Math.max(m.floor, mid - span / 2);
                y.suggestedMax = Math.min(m.ceil, mid + span / 2);
            } else {
                y.suggestedMin = undefined;
                y.suggestedMax = undefined;
            }
            chart.update();

            // stats
            const s = m.stats(d.stats);
            const set = (name, text) => { panel.querySelector(`[data-stat="${name}"]`).textContent = text; };
            const extreme = (f, pick) => {
                let best = null;
                for (const p of filled) if (best === null || pick(f(p), f(best))) best = p;
                return best;
            };
            const pLo = extreme(m.lo, (a, b) => a < b);
            const pHi = extreme(m.hi, (a, b) => a > b);

            set("low", s.min === null ? "–" : `${one(s.min)} ${m.unit}`);
            set("low-at", pLo ? whenText(pLo.t, range) : "");
            set("avg", s.avg === null ? "–" : `${one(s.avg)} ${m.unit}`);
            set("high", s.max === null ? "–" : `${one(s.max)} ${m.unit}`);
            set("high-at", pHi ? whenText(pHi.t, range) : "");
            set("sd", s.stdev === null ? "–"
                : s.stdev < 0.05 ? `under 0.1 ${m.unit}`
                    : `± ${s.stdev.toFixed(s.stdev < 1 ? 2 : 1)} ${m.unit}`);

            panel.querySelector(".band-text").textContent = "Low to high within " + bucketWords(d.bucketMs);

            const empty = panel.querySelector(".empty");
            empty.hidden = filled.length > 0;
            empty.textContent = `No readings in ${RANGE_TEXT[range]}. They appear here as the sensor sends them.`;

            $("chart-" + key).setAttribute("aria-label",
                filled.length
                    ? `${m.name[0].toUpperCase() + m.name.slice(1)} over ${RANGE_TEXT[range]}: low ${one(s.min)}, high ${one(s.max)}, average ${one(s.avg)} ${m.unit}.`
                    : `No ${m.name} readings in ${RANGE_TEXT[range]}.`);

            const details = panel.querySelector("details");
            if (details.open) renderTable(key);
        }

        function renderTable(key) {
            const m = METRICS[key];
            const wrap = $("panel-" + key).querySelector(".table-wrap");
            const scroll = wrap.scrollTop;
            const table = document.createElement("table");
            const head = table.createTHead().insertRow();
            for (const h of ["Time", `Average (${m.unit})`, `Low (${m.unit})`, `High (${m.unit})`, "Readings"]) {
                const th = document.createElement("th");
                th.textContent = h;
                head.append(th);
            }
            const body = table.createTBody();
            for (let i = grid.length - 1; i >= 0; i--) {
                const p = grid[i];
                if (p.empty) continue;
                const tr = body.insertRow();
                for (const v of [spanText(p.t, last.bucketMs, range), one(m.avg(p)), one(m.lo(p)), one(m.hi(p)), p.samples.toLocaleString()]) {
                    tr.insertCell().textContent = v;
                }
            }
            if (!body.rows.length) {
                const td = body.insertRow().insertCell();
                td.colSpan = 5;
                td.textContent = `No readings in ${RANGE_TEXT[range]}.`;
            }
            wrap.replaceChildren(table);
            wrap.scrollTop = scroll;
        }

        function changeText(m, v) {
            if (v === null || v === undefined) return null;
            if (Math.abs(v) < m.steady) return `${m.name} held steady`;
            return `${m.name} ${v > 0 ? "rose" : "fell"} ${Math.abs(v).toFixed(1)} ${m.unit}`;
        }

        function render(d) {
            last = d;
            grid = buildGrid(d);
            const s = d.stats;

            $("now-temp").textContent = one(s.temperature.current);
            $("now-hum").textContent = one(s.humidity.current);

            const parts = [changeText(METRICS.temp, s.temperature.change), changeText(METRICS.hum, s.humidity.change)].filter(Boolean);
            let summary = parts.length
                ? `Over ${RANGE_TEXT[range]}, ${parts.join(" and ")}.`
                : `No readings in ${RANGE_TEXT[range]} yet.`;
            if (s.dewPoint !== null) summary += ` Dew point is ${one(s.dewPoint)} °C.`;
            $("summary").textContent = summary;

            // Liveness: a flat line looks the same whether the room is stable or
            // the sensor died, so say which.
            const live = $("live");
            const age = s.latestTs === null ? null : d.now - s.latestTs;
            if (age === null) {
                live.dataset.state = "none";
                $("live-state").textContent = "Waiting for data";
                $("live-age").textContent = "";
            } else {
                live.dataset.state = age < 30_000 ? "good" : age < 5 * 60_000 ? "warn" : "bad";
                $("live-state").textContent = age < 30_000 ? "Live" : age < 5 * 60_000 ? "Delayed" : "Offline";
                $("live-age").textContent = "last reading " + ago(age);
            }

            renderChart("temp", d);
            renderChart("hum", d);

            const foot = $("foot");
            foot.className = "foot";
            if (s.count === 0) {
                foot.textContent = `No readings in ${RANGE_TEXT[range]}.`;
            } else {
                const span = s.lastTs - s.firstTs;
                const every = s.count > 1 && span > 0 ? (span / (s.count - 1) / 1000) : null;
                // Coverage counts buckets that actually hold readings, so an outage
                // in the middle of the range shows up here and not just as a gap.
                const cover = Math.round(grid.filter(p => !p.empty).length / grid.length * 100);
                foot.textContent =
                    `${s.count.toLocaleString()} readings in ${RANGE_TEXT[range]}` +
                    (every ? `, about one every ${every < 10 ? every.toFixed(1) : Math.round(every)} seconds.` : ".") +
                    ` Readings cover ${cover}% of the period` +
                    (cover < 97 ? "; gaps in the charts are times the sensor sent nothing." : ".");
            }

            $("main").classList.remove("refreshing");
        }

        async function refresh() {
            const asked = range;
            try {
                const res = await fetch("/api/series?range=" + asked);
                if (!res.ok) throw new Error("the server answered " + res.status);
                const d = await res.json();
                if (asked !== range) return; // a newer range was picked meanwhile
                render(d);
            } catch (err) {
                $("main").classList.remove("refreshing");
                const foot = $("foot");
                foot.className = "foot error";
                foot.textContent = last
                    ? `Can't reach the server (${err.message}). Showing the last data received and retrying every 5 seconds.`
                    : `Can't reach the server (${err.message}). Retrying every 5 seconds.`;
            }
        }

        // ---------- wiring ----------
        function selectRange(r, { fetchNow }) {
            range = r;
            for (const b of $("range").querySelectorAll("button")) {
                b.setAttribute("aria-pressed", String(b.dataset.range === r));
            }
            if (location.hash !== "#" + r) history.replaceState(null, "", "#" + r);
            if (fetchNow) {
                // Keep the previous charts on screen, dimmed, until the new range lands.
                $("main").classList.add("refreshing");
                refresh();
            }
        }

        $("range").addEventListener("click", e => {
            const btn = e.target.closest("button");
            if (!btn || btn.dataset.range === range) return;
            selectRange(btn.dataset.range, { fetchNow: true });
        });

        // The URL hash holds the range, so a view can be bookmarked (/#1w).
        const fromHash = location.hash.slice(1);
        if (RANGE_TEXT[fromHash]) selectRange(fromHash, { fetchNow: false });

        for (const key of Object.keys(METRICS)) {
            $("panel-" + key).querySelector("details").addEventListener("toggle", e => {
                if (e.target.open && last) renderTable(key);
            });
        }

        // ---------- theme ----------
        // Canvas colours are read from CSS tokens when a chart is built, so a theme
        // change rebuilds the charts rather than just swapping stylesheet values.
        function applyTheme(t) {
            document.documentElement.dataset.theme = t;
            $("theme").setAttribute("aria-pressed", String(t === "dark"));
            buildCharts();
            if (last) render(last);
        }

        $("theme").setAttribute("aria-pressed", String(document.documentElement.dataset.theme === "dark"));

        $("theme").addEventListener("click", () => {
            const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            try { localStorage.setItem("theme", next); } catch (e) { }
            applyTheme(next);
        });

        // Until someone picks a theme, keep following the OS setting.
        matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
            let saved = null;
            try { saved = localStorage.getItem("theme"); } catch (err) { }
            if (!saved) applyTheme(e.matches ? "dark" : "light");
        });

        buildCharts();
        refresh();
        setInterval(refresh, POLL_MS);

        // Canvas text is measured at draw time; redraw once the webfont is in.
        document.fonts?.ready.then(() => {
            buildCharts();
            if (last) render(last);
        });
    </script>
</body>

</html>
